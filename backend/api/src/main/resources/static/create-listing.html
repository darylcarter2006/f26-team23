<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create Listing - Spartan Marketplace</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html"><span class="logo-mark">S</span>Spartan Marketplace</a>
      <div class="search-wrap"></div>
      <nav class="auth-buttons">
        <a class="btn btn-ghost" href="index.html">Home</a>
        <a class="btn btn-primary" href="create-listing.html">Create Listing</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="panel">
      <h1>Create a Listing</h1>
      <p class="error-banner hidden" id="formErrorBanner"></p>
      <p class="success-banner hidden" id="formSuccessBanner"></p>
      <form class="listing-form" id="createListingForm">
        <label for="titleInput">Title</label>
        <input type="text" id="titleInput" />

        <label for="descriptionInput">Description</label>
        <textarea id="descriptionInput" rows="4"></textarea>

        <label for="priceInput">Price (whole dollars)</label>
        <input type="number" id="priceInput" step="1" min="0" />

        <label for="categorySelect">Category</label>
        <select id="categorySelect"></select>

        <label for="photoUrlInput">Photo URL (optional)</label>
        <input type="url" id="photoUrlInput" />

        <button type="submit" class="btn btn-primary">Submit Listing</button>
      </form>
    </div>
  </main>

  <script src="api-helper.js"></script>
  <script src="create-listing.js"></script>
</body>
</html>
