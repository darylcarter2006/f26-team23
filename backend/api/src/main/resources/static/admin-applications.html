<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vendor Applications - Spartan Marketplace</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="vendor-pages.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html"><span class="logo-mark">S</span>Spartan Marketplace</a>
      <div class="search-wrap"></div>
      <nav class="auth-buttons">
        <a class="btn btn-ghost" href="index.html">Home</a>
        <a class="btn btn-primary" href="admin-applications.html">Vendor Applications</a>
      </nav>
    </div>
  </header>

  <main class="page-content wide">
    <div class="panel">
      <h1>Vendor Applications</h1>
      <p class="page-sub-text">Approve to upgrade the applicant to a vendor, or reject to decline the application.</p>
      <p class="error-banner hidden" id="errorBanner"></p>
      <p class="success-banner hidden" id="successBanner"></p>

      <div class="toolbar">
        <label for="statusFilterSelect">Show</label>
        <select id="statusFilterSelect">
          <option value="PENDING">Pending</option>
          <option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected</option>
          <option value="">All</option>
        </select>
        <span class="muted" id="applicationCount"></span>
      </div>

      <table class="data-table" id="applicationsTable">
        <thead>
          <tr><th>Business</th><th>Selling</th><th>Team</th><th>Student ID</th><th>Submitted</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="applicationsTableBody"></tbody>
      </table>
      <div class="empty-state hidden" id="emptyState">
        <p>No applications to show.</p>
      </div>
    </div>
  </main>

  <script src="api-helper.js"></script>
  <script src="demo-identity.js"></script>
  <script src="admin-applications.js"></script>
</body>
</html>
