spring.application.name=api

# Neon / Postgres connection string comes from the environment, never from this file:
#   export SPRING_DATASOURCE_URL="jdbc:postgresql://..."
# Defaults below point at a local Postgres for development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spartan_marketplace}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# comma-separated .edu emails that become SysAdmins when they sign up
app.admin-emails=${ADMIN_EMAILS:}

server.port=${PORT:8080}
