spring:
  datasource:
    # Local dev default: a Postgres instance running on your own machine,
    # so `mvn spring-boot:run` works out of the box with zero setup.
    #
    # To point at the real Supabase database instead, set these three as
    # environment variables (never commit real credentials to this file):
    #   DB_URL      jdbc:postgresql://<your-supabase-host>:5432/postgres
    #   DB_USER     the service_role Postgres user (Project Settings > Database)
    #   DB_PASSWORD the service_role password from the same page
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spartan_marketplace}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

server:
  port: ${PORT:8080}
